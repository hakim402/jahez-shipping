# Install ONLY after confirming this file is included inside Nginx's http {} context.
map $request_method $jahez_shipping_post_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $jahez_shipping_post_key zone=jahez_shipping_login:10m rate=2r/m;
log_format jahez_shipping_safe escape=json
    '{"time":"$time_iso8601","event":"shipping.edge","method":"$request_method",'
    '"status":$status,"duration":"$request_time","upstream_status":"$upstream_status",'
    '"request_id":"$upstream_http_x_request_id"}';

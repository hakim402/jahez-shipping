# HTTP bootstrap: challenges and maintenance only; no app/login over HTTP.
server {
    listen 80;
    server_name shipping.jahez.online;
    if ($host != shipping.jahez.online) { return 444; }
    access_log /var/log/nginx/jahez-shipping-access.log jahez_shipping_safe;
    error_log syslog:server=unix:/run/jahez-shipping-nginx-log.sock,nohostname,tag=jahez_shipping warn;
    server_tokens off;
    client_max_body_size 6m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jahez-shipping-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 503 "JAHEZ Shipping is being prepared. Please try again shortly.\n";
    }
}

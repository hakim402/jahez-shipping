# Install only after real certificate paths exist and bootstrap has succeeded.
server {
    listen 80;
    server_name shipping.jahez.online;
    if ($host != shipping.jahez.online) { return 444; }
    access_log /var/log/nginx/jahez-shipping-access.log jahez_shipping_safe;
    error_log syslog:server=unix:/run/jahez-shipping-nginx-log.sock,nohostname,tag=jahez_shipping warn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jahez-shipping-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://shipping.jahez.online$request_uri; }
}
server {
    listen 443 ssl;
    server_name shipping.jahez.online;
    if ($host != shipping.jahez.online) { return 444; }
    ssl_certificate /etc/letsencrypt/live/shipping.jahez.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shipping.jahez.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:jahez_shipping_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/jahez-shipping-access.log jahez_shipping_safe;
    error_log syslog:server=unix:/run/jahez-shipping-nginx-log.sock,nohostname,tag=jahez_shipping warn;
    client_max_body_size 6m;
    client_body_timeout 30s;
    send_timeout 45s;
    limit_req_status 429;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jahez-shipping-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location ^~ /health/ { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
    location ~ ^/(media|private|data|backups)(/|$) { return 404; }
    location = /webhooks/17track/ {
        client_max_body_size 512k;
        include /etc/nginx/snippets/jahez-shipping-proxy.conf;
    }
    location ~ ^/(en|ar)/admin/login/$ {
        limit_req zone=jahez_shipping_login burst=10 nodelay;
        include /etc/nginx/snippets/jahez-shipping-proxy.conf;
    }
    location ~ ^/(en|ar)/$ {
        limit_req zone=jahez_shipping_lookup burst=30 nodelay;
        include /etc/nginx/snippets/jahez-shipping-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/jahez-shipping-proxy.conf;
    }
}

name: jahez-shipping-dev
x-app: &app
  image: jahez-shipping-dev:0.4.0
  build:
    context: .
    target: development
  env_file: .env.dev
  volumes:
    - .:/app
    - shipping_data:/data
    - beat_state:/beat
  depends_on:
    redis:
      condition: service_healthy
  networks: [shipping]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  web:
    <<: *app
    ports: ["127.0.0.1:18744:8000"]
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
  worker:
    <<: *app
    command: celery -A config worker --concurrency=1 --loglevel=INFO --hostname=shipping@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 --destination shipping@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  beat:
    <<: *app
    command: celery -A config beat --loglevel=INFO --schedule=/beat/celerybeat-schedule --pidfile=/beat/beat.pid
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/beat/beat.pid').read_text()), 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  frontend:
    image: node:22.23.3-bookworm-slim
    working_dir: /app
    command: sh -c 'npm ci --ignore-scripts && npm run build && npm run watch'
    volumes:
      - .:/app
      - frontend_modules:/app/node_modules
    networks: [shipping]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  redis:
    image: redis:7.4.11-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    networks: [shipping]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  shipping:
volumes:
  shipping_data:
  redis_data:
  beat_state:
  frontend_modules:

name: Publication policy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  private-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_publication.py HEAD
      - run: python3 -m unittest tests.test_publication_policy
